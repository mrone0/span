name: Desktop Clipboard Test

on:
  push:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/desktop-test.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/desktop-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Desktop clipboard (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test workspace
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee cargo-test.log

      - name: Publish cargo failure details
        if: failure()
        shell: bash
        run: |
          MESSAGE="$(tail -n 35 cargo-test.log 2>/dev/null | tr '\r\n' '  ')"
          MESSAGE="${MESSAGE//'%'/'%25'}"
          echo "::error title=Desktop cargo test failed::$MESSAGE"

      - name: Check all targets
        run: cargo check --workspace --all-targets
