name: Android Clipboard Test

on:
  push:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-test.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bidirectional-clipboard:
    name: Android bidirectional clipboard (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35, 36]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run bidirectional clipboard integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: apps/android
          script: |
            ./gradlew :app:connectedDebugAndroidTest :app:assembleRelease
            ./scripts/accessibility-clipboard-smoke.sh
            adb uninstall app.span.android || true
            adb install app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n app.span.android/.MainActivity
            adb shell pidof app.span.android
