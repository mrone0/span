name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            archive: span-macos-arm64.tar.gz
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            archive: span-macos-x64.tar.gz
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: span-windows-x64.zip
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: span-linux-x64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test
        run: cargo test --workspace

      - name: Build CLI, daemon and GUI
        run: cargo build --release --target ${{ matrix.target }} -p span --bin span --bin span-gui

      - name: Ad-hoc sign macOS binaries
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_P12_BASE64 == ''
        run: |
          codesign --force --sign - target/${{ matrix.target }}/release/span
          codesign --force --sign - target/${{ matrix.target }}/release/span-gui
          codesign --verify --verbose=2 target/${{ matrix.target }}/release/span
          codesign --verify --verbose=2 target/${{ matrix.target }}/release/span-gui

      - name: Import Developer ID certificate
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_P12_BASE64 != ''
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/span-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          IDENTITY="$MACOS_SIGNING_IDENTITY"
          if [ -z "$IDENTITY" ]; then
            IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)
          fi
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application signing identity found" >&2
            exit 1
          fi
          echo "MACOS_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Developer ID sign macOS binaries
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_P12_BASE64 != ''
        run: |
          codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" target/${{ matrix.target }}/release/span
          codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" target/${{ matrix.target }}/release/span-gui
          codesign --verify --verbose=2 target/${{ matrix.target }}/release/span
          codesign --verify --verbose=2 target/${{ matrix.target }}/release/span-gui

      - name: Stage macOS minimal app bundle
        if: runner.os == 'macOS'
        run: |
          rm -rf dist
          mkdir -p dist/Span.app/Contents/MacOS dist/Span.app/Contents/Resources
          cp target/${{ matrix.target }}/release/span dist/Span.app/Contents/MacOS/span
          cp target/${{ matrix.target }}/release/span-gui dist/Span.app/Contents/MacOS/span-gui
          cp assets/Span.icns dist/Span.app/Contents/Resources/Span.icns
          VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="${VERSION%%-*}"
          APP_BUILD="${GITHUB_RUN_NUMBER}"
          cat > dist/Span.app/Contents/Info.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key><string>Span</string>
            <key>CFBundleExecutable</key><string>span-gui</string>
            <key>CFBundleIconFile</key><string>Span</string>
            <key>CFBundleIconName</key><string>Span</string>
            <key>CFBundleIdentifier</key><string>com.span.clipboard</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>Span</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleDevelopmentRegion</key><string>zh_CN</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.utilities</string>
            <key>LSMultipleInstancesProhibited</key><true/>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSLocalNetworkUsageDescription</key><string>Span 使用本地网络发现附近设备并同步剪贴板文本。</string>
            <key>CFBundleShortVersionString</key><string>$APP_VERSION</string>
            <key>CFBundleVersion</key><string>$APP_BUILD</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
          </dict>
          </plist>
          PLIST
          chmod +x dist/Span.app/Contents/MacOS/span dist/Span.app/Contents/MacOS/span-gui
          if [ -n "$MACOS_CERTIFICATE_P12_BASE64" ]; then
            codesign --force --deep --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" dist/Span.app
          else
            codesign --force --deep --sign - dist/Span.app
          fi

      - name: Notarize macOS app
        if: runner.os == 'macOS' && env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != '' && env.MACOS_CERTIFICATE_P12_BASE64 != ''
        run: |
          mkdir -p dist/notary
          ditto -c -k --keepParent dist/Span.app dist/notary/Span.app.zip
          xcrun notarytool submit dist/notary/Span.app.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple dist/Span.app


      - name: Pack macOS artifacts
        if: runner.os == 'macOS'
        run: |
          tar -czf dist/${{ matrix.archive }} -C dist Span.app
          DMG_NAME="${{ matrix.archive }}"
          DMG_NAME="${DMG_NAME%.tar.gz}.dmg"
          mkdir -p dist/dmg
          cp -R dist/Span.app dist/dmg/Span.app
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Span" -srcfolder dist/dmg -ov -format UDZO "dist/$DMG_NAME"
          rm -rf dist/dmg

      - name: Stage Linux minimal artifact
        if: runner.os == 'Linux'
        run: |
          rm -rf dist
          mkdir -p dist/span
          cp target/${{ matrix.target }}/release/span dist/span/span
          cp target/${{ matrix.target }}/release/span-gui dist/span/span-gui
          tar -czf dist/${{ matrix.archive }} -C dist span

      - name: Stage Windows minimal artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force dist/span | Out-Null
          Copy-Item target/${{ matrix.target }}/release/span.exe dist/span/span.exe
          Copy-Item target/${{ matrix.target }}/release/span-gui.exe dist/span/span-gui.exe
          Compress-Archive -Path dist/span -DestinationPath dist/${{ matrix.archive }} -Force

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            $version = '0.1.0-dev'
          }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }
          $env:SPAN_VERSION = $version
          & $iscc installer/windows/span.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            dist/${{ matrix.archive }}
            dist/*.dmg
            dist/*-setup.exe

  android-apk:
    name: Build android-apk
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android platform
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android integration gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: apps/android
          script: |
            ./gradlew :app:connectedDebugAndroidTest
            ./scripts/accessibility-clipboard-smoke.sh

      - name: Configure stable Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SPAN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SPAN_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SPAN_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            SPAN_ANDROID_KEYSTORE_PASSWORD \
            SPAN_ANDROID_KEY_ALIAS \
            SPAN_ANDROID_KEY_PASSWORD \
            ANDROID_SIGNING_CERT_SHA256; do
            if [ -z "${!name}" ]; then
              echo "Missing required Android signing secret: $name" >&2
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/span-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "SPAN_ANDROID_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Test and build APKs
        env:
          SPAN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SPAN_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SPAN_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd apps/android
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          VERSION_CODE="$((10000 + GITHUB_RUN_NUMBER))"
          ./gradlew \
            :app:lintDebug \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:assembleRelease \
            -PspanVersionName="$VERSION_NAME" \
            -PspanVersionCode="$VERSION_CODE"

      - name: Verify Android signing certificate
        shell: bash
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          fi
          APK="apps/android/app/build/outputs/apk/release/app-release.apk"
          EXPECTED="$(printf '%s' "$ANDROID_SIGNING_CERT_SHA256" \
            | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]:' )"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]:' )"
          if [[ ! "$EXPECTED" =~ ^[0-9a-f]{64}$ || "$ACTUAL" != "$EXPECTED" ]]; then
            echo "Android signing certificate fingerprint mismatch: $ACTUAL" >&2
            exit 1
          fi

      - name: Remove temporary Android keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/span-release.jks"

      - name: Stage Android artifacts
        run: |
          mkdir -p dist
          cp apps/android/app/build/outputs/apk/release/app-release.apk dist/span-android-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/span-android-release.apk

  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: 'desktop-*'
          merge-multiple: true

      - name: Download Android release artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist

      - name: List release assets
        run: find dist -maxdepth 2 -type f -print | sort

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true

  publish-npm:
    name: Publish npm desktop installer
    if: startsWith(github.ref, 'refs/tags/v')
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Get npm access token (OIDC)
        id: npm-token
        uses: actions/github-script@v7
        with:
          script: |
            const { getAuth } = require('@actions/github/lib/auth');
            const { getAccessToken } = require('@actions/oauth-helper');
            const audience = process.env.REGISTRY_AUDIENCE || 'npm:https://registry.npmjs.org';
            const auth = await getAuth({ allowLegacyOAuthToken: false, audience });
            const token = await getAccessToken(auth);
            core.setOutput('token', token);

      - name: Align npm version with Git tag
        env:
          NODE_AUTH_TOKEN: ${{ steps.npm-token.outputs.token }}
        working-directory: npm/span-desktop
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      - name: Publish span-desktop
        env:
          NODE_AUTH_TOKEN: ${{ steps.npm-token.outputs.token }}
        working-directory: npm/span-desktop
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then
            npm publish --access public --tag test
          else
            npm publish --access public
          fi
