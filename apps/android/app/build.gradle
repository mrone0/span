plugins { id 'com.android.application' }

def spanVersionCode = providers.gradleProperty('spanVersionCode').orElse('13').get().toInteger()
def spanVersionName = providers.gradleProperty('spanVersionName').orElse('0.1.2-dev').get()
def releaseKeystorePath = System.getenv('SPAN_ANDROID_KEYSTORE_FILE')
def releaseKeystorePassword = System.getenv('SPAN_ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('SPAN_ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('SPAN_ANDROID_KEY_PASSWORD')
def hasReleaseSigning = [
        releaseKeystorePath,
        releaseKeystorePassword,
        releaseKeyAlias,
        releaseKeyPassword,
].every { value -> value != null && !value.trim().isEmpty() } &&
        file(releaseKeystorePath ?: 'missing-release-keystore').isFile()

android {
    namespace 'app.span.android'
    compileSdk 36

    defaultConfig {
        applicationId 'app.span.android'
        minSdk 29
        targetSdk 36
        versionCode spanVersionCode
        versionName spanVersionName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // Local preview builds remain installable with the developer's debug
            // key. Tagged GitHub releases provide the stable release credentials
            // above and fail in the workflow before Gradle when they are missing.
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
