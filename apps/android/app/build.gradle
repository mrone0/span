plugins { id 'com.android.application' }

def spanVersionCode = providers.gradleProperty('spanVersionCode').orElse('13').get().toInteger()
def spanVersionName = providers.gradleProperty('spanVersionName').orElse('0.1.2-dev').get()

// Signing credentials come from the CI environment first, then from the
// gitignored apps/android/local/signing.properties used by local builds.
// Sharing one key between CI artifacts, tagged releases and local installs is
// what lets an APK always be installed as an update instead of a reinstall.
def localSigningFile = new File(rootDir, 'local/signing.properties')
def localSigning = new Properties()
if (localSigningFile.isFile()) {
    localSigningFile.withInputStream { localSigning.load(it) }
}

def signingValue = { String envName, String propertyName ->
    def fromEnv = System.getenv(envName)
    if (fromEnv != null && !fromEnv.trim().isEmpty()) {
        return fromEnv.trim()
    }
    def fromFile = localSigning.getProperty(propertyName)
    return fromFile == null ? null : fromFile.trim()
}

def stableKeystorePath = signingValue('SPAN_ANDROID_KEYSTORE_FILE', 'storeFile')
if (stableKeystorePath != null) {
    def stableKeystore = new File(stableKeystorePath)
    if (!stableKeystore.isAbsolute()) {
        stableKeystore = new File(localSigningFile.parentFile, stableKeystorePath)
    }
    stableKeystorePath = stableKeystore.absolutePath
}
def stableStorePassword = signingValue('SPAN_ANDROID_KEYSTORE_PASSWORD', 'storePassword')
def stableKeyAlias = signingValue('SPAN_ANDROID_KEY_ALIAS', 'keyAlias')
def stableKeyPassword = signingValue('SPAN_ANDROID_KEY_PASSWORD', 'keyPassword')
def hasStableSigning = [
        stableKeystorePath,
        stableStorePassword,
        stableKeyAlias,
        stableKeyPassword,
].every { value -> value != null && !value.isEmpty() } &&
        new File(stableKeystorePath ?: 'missing-keystore').isFile()

android {
    namespace 'app.span.android'
    compileSdk 36

    defaultConfig {
        applicationId 'app.span.android'
        minSdk 29
        targetSdk 36
        versionCode spanVersionCode
        versionName spanVersionName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        stable {
            if (hasStableSigning) {
                storeFile new File(stableKeystorePath)
                storePassword stableStorePassword
                keyAlias stableKeyAlias
                keyPassword stableKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // Without the stable key a local preview build falls back to the
            // developer's debug key; CI passes the credentials above and then
            // verifies the certificate fingerprint in the workflow.
            signingConfig hasStableSigning ? signingConfigs.stable : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Debug installs must remain upgradeable over CI builds too, so the
            // stable key wins whenever it is available on this machine.
            signingConfig hasStableSigning ? signingConfigs.stable : signingConfigs.debug
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
